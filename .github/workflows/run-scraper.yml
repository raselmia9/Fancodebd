name: FanCode Link Extractor & Status Save

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

jobs:
  run-extractor:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Run Extractor Script
        run: npm start

      - name: Commit and Push status.txt
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add status.txt
          git commit -m "Auto-update: Latest FanCode links and status [skip ci]" || echo "No changes to commit"
          git push
          
