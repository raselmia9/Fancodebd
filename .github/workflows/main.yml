name: Save FanCode Source Code

on:
  workflow_dispatch: # ম্যানুয়ালি রান করার অপশন
  schedule:
    - cron: '0 */6 * * *' # প্রতি ৬ ঘণ্টা পর পর অটো রান হবে (প্রয়োজনমতো বদলাতে পারেন)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: playwright install chromium

      - name: Run Source Scraper
        run: python main.py

      - name: Commit and Push HTML Source File
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add fancode_source.html
          git commit -m "Auto-update FanCode HTML source code" || echo "No changes to commit"
          git push
